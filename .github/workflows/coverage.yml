name: Coverage Badge

on:
  push:
    branches: [main, test/*]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests & JaCoCo report
        run: ./gradlew :shared:testAndroidHostTest :shared:jacocoTestReport

      - name: Parse coverage
        run: |
          COV=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('shared/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml')
          for c in tree.findall('.//counter[@type=\"LINE\"]'):
              covered = int(c.get('covered'))
              missed = int(c.get('missed'))
              total = covered + missed
              pct = round(covered * 100 / total, 1) if total else 0
              print(f'{pct}')
              break
          ")
          echo "COVERAGE=${COV}" >> $GITHUB_ENV
          echo "Coverage: ${COV}%"

      - name: Update badge JSON
        run: |
          python3 -c "
          import json, os
          cov = os.environ['COVERAGE']
          color = 'blue'
          badge = {
              'schemaVersion': 1,
              'label': 'coverage',
              'message': f'{cov}%',
              'color': color
          }
          with open('.github/coverage-badge.json', 'w') as f:
              json.dump(badge, f, indent=2)
          "

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/coverage-badge.json
          git diff --cached --quiet || git commit -m "ci: update coverage badge [skip ci]" && git push
